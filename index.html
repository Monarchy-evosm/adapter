<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNARCHY // ADAPTER</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-main: #141414;
            --inner-card: #e5e5e5;
            --accent: #9b5cff;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text-light);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Анимированный фон со сферами */
        .bg-spheres {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; overflow: hidden; filter: blur(40px); opacity: 0.4;
        }
        .sphere {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a, #000);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
            animation: float 20s infinite alternate;
        }
        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 100px) scale(1.2); }
        }

        /* Главный контейнер */
        .main-card {
            position: relative; z-index: 10;
            width: 90%; max-width: 800px;
            background: var(--card-main);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 0 100px rgba(0,0,0,0.5), 0 0 40px rgba(155, 92, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Шапка как на картинке */
        .header {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 40px; position: relative;
        }

        .avatar-wrapper {
            position: relative; width: 100px; height: 100px;
        }
        .avatar-wrapper img {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--accent);
            box-shadow: 0 0 25px var(--accent);
        }

        .user-meta h1 { margin: 0; font-size: 28px; font-weight: 700; }
        .user-meta p { margin: 5px 0 0; color: #888; font-size: 14px; }

        /* Вкладки */
        .nav-tabs {
            display: flex; gap: 10px; margin-left: auto;
        }
        .tab-btn {
            background: #222; color: #eee; border: none;
            padding: 10px 20px; border-radius: 20px;
            cursor: pointer; font-weight: 600; font-size: 13px;
        }
        .tab-btn.active { background: var(--accent); color: white; }
        .tab-btn.ghost { background: white; color: black; }

        /* Сетка контента (белые карточки) */
        .content-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            animation: fadeIn 0.5s ease;
        }

        .info-box {
            background: var(--inner-card);
            border-radius: 15px; padding: 20px;
            color: var(--text-dark); position: relative;
            display: flex; flex-direction: column; justify-content: center;
        }
        .info-box label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #666; margin-bottom: 4px; }
        .info-box span { font-weight: 600; font-size: 14px; color: #111; }
        .info-box .icon { position: absolute; right: 15px; width: 20px; height: 20px; background: #ccc; border-radius: 50%; border: 3px solid #fff; }

        /* Футер */
        .footer {
            margin-top: 40px; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-primary {
            background: var(--accent); color: white; text-decoration: none;
            padding: 15px 30px; border-radius: 25px; font-weight: 700;
            font-size: 14px; box-shadow: 0 10px 20px rgba(155, 92, 255, 0.3);
        }
        .btn-primary:hover { transform: translateY(-3px); }

        .footer-tag { background: white; color: black; padding: 10px 25px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Мобилка */
        @media (max-width: 700px) {
            .main-card { padding: 25px; border-radius: 30px; }
            .header { flex-direction: column; text-align: center; }
            .nav-tabs { margin: 20px 0 0; width: 100%; justify-content: center; }
            .content-grid { grid-template-columns: 1fr; }
            .footer { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<div class="bg-spheres">
    <div class="sphere" style="width: 300px; height: 300px; top: 10%; left: 10%;"></div>
    <div class="sphere" style="width: 200px; height: 200px; top: 60%; left: 70%; animation-delay: -5s;"></div>
    <div class="sphere" style="width: 150px; height: 150px; top: 30%; left: 80%; animation-delay: -10s;"></div>
</div>

<div class="main-card">
    <header class="header">
        <div class="avatar-wrapper">
            <img src="avatar.jpg" alt="MN" onerror="this.src='https://ui-avatars.com/api/?background=000&color=9b5cff&name=MN&size=200'">
        </div>
        <div class="user-meta">
            <h1>@mnarchy</h1>
            <p>Owner EVOSM ›</p>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('main')">Profile</button>
            <button class="tab-btn">Nodes</button>
            <button class="tab-btn ghost">Active</button>
        </div>
    </header>

    <div id="tab-content">
        <div class="content-grid">
            <div class="info-box">
                <label>Status</label>
                <span>Expert Coder / 2022</span>
                <div class="icon"></div>
            </div>
            <div class="info-box">
                <label>Role</label>
                <span>System Arch & Pentest</span>
                <div class="icon"></div>
            </div>
            <div class="info-box">
                <label>Main Project</label>
                <span>EVOSM Intelligence</span>
                <div class="icon"></div>
            </div>
            <div class="info-box">
                <label>Current Stack</label>
                <span>Python / Node.js / C++</span>
                <div class="icon"></div>
            </div>
            <div class="info-box" style="grid-column: 1 / -1; cursor: pointer;" onclick="copyTox()">
                <label>Connection (qTox)</label>
                <span id="tox-id" style="font-size: 11px; font-family: monospace;">57AF5F2AC7DA8973A7507A01A5A005E49F4F8AB89CF00B5152C5E7FFD276EF3B357A7F5D7B3F</span>
                <div class="icon" style="background: var(--accent);"></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <a href="https://t.me/euqlida" class="btn-primary">t.me/euqlida</a>
        <div class="footer-tag" onclick="location.reload()">System Online ›</div>
    </footer>
</div>

<script>
    function copyTox() {
        const text = document.getElementById('tox-id').innerText;
        navigator.clipboard.writeText(text);
        alert('Ключ скопирован!');
    }
</script>

</body>
                               </html>
